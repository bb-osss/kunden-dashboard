:root[data-theme="dark"]{--bg:#101317;--card:#1a1f26;--tx:#eceff4;--mu:#9aa4b3;--ln:#2b323c;--ac:#4cc9a0;--ac2:#16342b;--wa:#f3b25e;--wb:#3a2c14;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 14px 8px;border-bottom:1px solid var(--ln)}
h1{font-size:20px;margin:0 0 8px}
.search{width:100%;font:inherit;padding:12px 14px;border-radius:12px;border:1px solid var(--ln);background:var(--card);color:var(--tx)}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center}
select,button{font:inherit;color:var(--tx)}
select{padding:8px;border-radius:10px;border:1px solid var(--ln);background:var(--card);max-width:48%}
.btn{padding:9px 14px;border-radius:10px;border:1px solid var(--ln);background:var(--card);cursor:pointer}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
:root[data-theme="dark"] .btn.p,:root:not([data-theme="light"]) .btn.p{color:#06251b}
.cnt{color:var(--mu);font-size:14px;margin-left:auto}
main{padding:12px 14px 40px;max-width:900px;margin:0 auto}
.card{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:10px;margin-bottom:10px;cursor:pointer}
.card:active{background:var(--ac2)}
.qr{width:84px;height:84px;flex:none;border-radius:6px;overflow:hidden;background:#fff}
.qr svg{display:block;width:100%;height:100%}
.nr{font-weight:700;color:var(--ac)}.nm{font-weight:600}.ad{color:var(--mu);font-size:14px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--ac2);color:var(--ac);margin:4px 4px 0 0}
.tag.w{background:var(--wb);color:var(--wa)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:none;overflow:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
.ov.on{display:block}
.dlg{background:var(--card);border-radius:16px;max-width:560px;margin:0 auto;padding:16px}
.big{width:min(260px,70vw);aspect-ratio:1;margin:8px auto;border-radius:8px;overflow:hidden;background:#fff}
.big svg{display:block;width:100%;height:100%}
dl{margin:12px 0}dt{font-size:12px;color:var(--mu);margin-top:10px}dd{margin:0;font-weight:500}
textarea.search{min-height:72px}label.ck{display:inline-flex;gap:6px;margin:12px 14px 0 0}.btn.d{color:#c0392b}a{color:var(--ac)}.empty{text-align:center;color:var(--mu);padding:40px 0}
#pa{display:none}
@media print{
 body>*:not(#pa){display:none!important}
 body{background:#fff;color:#000}
 #pa{display:grid!important;grid-template-columns:repeat(2,1fr);gap:10mm;padding:6mm}
 #pa.one{grid-template-columns:1fr}
 .lb{border:1.5px solid #000;border-radius:4mm;padding:5mm;text-align:center;break-inside:avoid;color:#000;background:#fff}
 .lb .q{width:62mm;height:62mm;margin:3mm auto}.one .lb .q{width:110mm;height:110mm}
 .lb .q svg{width:100%;height:100%}.lb b{font-size:16pt}.lb div{font-size:12pt}.lb small{font-size:9pt}
}
</style>
</head>

		throw new Error(num.length + "/" + shift);

	while (offset < num.length && num[offset] === 0) {
		offset++;
	}

	this.num = new Array(num.length - offset + shift);
	for (var i = 0; i < num.length - offset; i++) {
		this.num[i] = num[i + offset];
	}

	get : function(index) {
		return this.num[index];

	getLength : function() {
		return this.num.length;

	multiply : function(e) {
	
		var num = new Array(this.getLength() + e.getLength() - 1);
	
		for (var i = 0; i < this.getLength(); i++) {
			for (var j = 0; j < e.getLength(); j++) {
				num[i + j] ^= QRMath.gexp(QRMath.glog(this.get(i) ) + QRMath.glog(e.get(j) ) );

		}

	},
	
	mod : function(e) {
	
		if (this.getLength() - e.getLength() < 0) {
			return this;
		}
	
		var ratio = QRMath.glog(this.get(0) ) - QRMath.glog(e.get(0) );
	
		var num = new Array(this.getLength() );
		
		for (var i = 0; i < this.getLength(); i++) {
			num[i] = this.get(i);
		}
		
		for (var x = 0; x < e.getLength(); x++) {
			num[x] ^= QRMath.gexp(QRMath.glog(e.get(x) ) + ratio);
		}
	
		// recursive call
		return new QRPolynomial(num, 0).mod(e);

 const u=url(k);if(cache[u])return cache[u];
 let q=null;
 for(let t=4;t<=40&&!q;t++){try{const x=new QRCodeLib(t,0);x.addData(u);x.make();q=x}catch(e){}}
 if(!q)return '';
 const n=q.getModuleCount(),m=2;let d='';
 for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+='M'+(c+m)+' '+(r+m)+'h1v1h-1z';

}

let scannerStream = null;
async function startScanner() {
  const video = document.createElement('video');
  video.style.cssText = 'width:100%;max-height:300px;border-radius:12px;background:#000;';
  video.setAttribute('playsinline', '');
  video.setAttribute('autoplay', '');
  
  const modal = document.createElement('div');
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1rem;';
  modal.innerHTML = '<h3 style="color:#fff;margin:0 0 1rem">Scanner</h3>';
  modal.appendChild(video);
  const closeBtn = document.createElement('button');
  closeBtn.className = 'btn';
  closeBtn.textContent = 'Schließen';
  closeBtn.style.marginTop = '1rem';
  closeBtn.onclick = stopScanner;
  modal.appendChild(closeBtn);
  document.body.appendChild(modal);
  
  try {
    scannerStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    video.srcObject = scannerStream;
    await video.play();
    
    if ('BarcodeDetector' in window) {
      const detector = new BarcodeDetector({ formats: ['qr_code', 'code_128', 'ean_13', 'code_39'] });
      const scan = async () => {
        if (!scannerStream) return;
        try {
          const barcodes = await detector.detect(video);
          if (barcodes.length > 0) {
            const value = barcodes[0].rawValue;
            document.getElementById('q').value = value;
            filter();
            stopScanner();
            return;
          }
        } catch(e) {}
        requestAnimationFrame(scan);
      };
      scan();
    } else {
      alert('BarcodeDetector nicht verfügbar. Bitte Chrome/Edge verwenden oder manuell suchen.');
    }
  } catch(err) {
    alert('Kamera-Zugriff verweigert oder nicht verfügbar.');
    stopScanner();
  }
  
  function stopScanner() {
    if (scannerStream) {
      scannerStream.getTracks().forEach(t => t.stop());
      scannerStream = null;
    }
    modal.remove();
  }
}
document.getElementById('scan').onclick = startScanner;

  video.setAttribute('autoplay', '');
  
  const modal = document.createElement('div');
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1rem;';
  modal.innerHTML = '<h3 style="color:#fff;margin:0 0 1rem">Scanner</h3>';
  modal.appendChild(video);
  const closeBtn = document.createElement('button');
  closeBtn.className = 'btn';
  closeBtn.textContent = 'Schließen';
  closeBtn.style.marginTop = '1rem';
  closeBtn.onclick = stopScanner;
  modal.appendChild(closeBtn);
  document.body.appendChild(modal);
  
  try {
    scannerStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    video.srcObject = scannerStream;
    await video.play();
    
    if ('BarcodeDetector' in window) {
      const detector = new BarcodeDetector({ formats: ['qr_code', 'code_128', 'ean_13', 'code_39'] });
      const scan = async () => {
        if (!scannerStream) return;
        try {
          const barcodes = await detector.detect(video);
          if (barcodes.length > 0) {
            const value = barcodes[0].rawValue;
            document.getElementById('q').value = value;
            filter();
            stopScanner();
            return;
          }
        } catch(e) {}
        requestAnimationFrame(scan);
      };
      scan();
    } else {
      alert('BarcodeDetector nicht verfügbar. Bitte Chrome/Edge verwenden oder manuell suchen.');
    }
  } catch(err) {
    alert('Kamera-Zugriff verweigert oder nicht verfügbar.');
    stopScanner();
  }
  
  function stopScanner() {
    if (scannerStream) {
      scannerStream.getTracks().forEach(t => t.stop());
      scannerStream = null;
    }
    modal.remove();
  }
}
document.getElementById('scan').onclick = startScanner;

reindex();filter();
</script>
</body>
</html>
